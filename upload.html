{% extends "base.html" %}{% block content %}<section class="panel narrow"><h1>Upload document</h1><p class="muted">Maximum 5 MB. Allowed: PDF, TXT, PNG, JPG, DOCX, CSV.</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{ csrf_token() }}">
<label>Display name<input name="name" maxlength="180" placeholder="e.g. Customer contract"></label><label>Category<input name="category" maxlength="80" required placeholder="e.g. Contracts"></label><label>File<input name="file" type="file" required></label><button>Upload securely</button></form></section>{% endblock %}
